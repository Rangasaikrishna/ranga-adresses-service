sources:
  - name: NASA
    handler:
      jsonSchema:
        endpoint: https://api.nasa.gov
        operations:
          - type: Query
            field: nasaNeoFeed
            path: /neo/rest/v1/feed?start_date={args.startDate}&end_date={args.endDate}&api_key=DEMO_KEY
            method: GET
            responseSchema: ./json-schemas/nasa-neo-feed.json
            responseTypeName: NasaNeoFeed
            argTypeMap:
              startDate:
                type: string
              endDate:
                type: string

sdk:
  generateOperations:
    selectionSetDepth: 6
